spring.application.name=sbj-redis
server.port=8080

# Conexión a Redis (cliente Lettuce). Se pueden sobrescribir con variables de entorno: REDIS_HOST, REDIS_PORT
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

# Recorrido por consola al arrancar
app.demo=true

spring.cache.type=redis
